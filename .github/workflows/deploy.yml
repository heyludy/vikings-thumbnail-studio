name: Deploy

# 휴대폰에서도 배포할 수 있게 만든 워크플로.
# GitHub 웹에서 Actions → Deploy → "Run workflow" 로 실행하면
# 선택한 브랜치를 Cloudflare Workers 로 배포하고, 이어서 제주국제오픈
# 프로젝트/참가팀 데이터를 배포본에 동기화한다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   필수. Workers Scripts 편집 + D1 편집 권한
#   CLOUDFLARE_ACCOUNT_ID  선택. 토큰이 여러 계정에 연결된 경우에만 필요

on:
  workflow_dispatch:
    inputs:
      sync_jeju:
        description: 제주국제오픈 프로젝트/참가팀 데이터도 동기화
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  SITE_URL: https://vikings.ludia0602.workers.dev
  CLOUDFLARE_DATABASE_ID: e0e1a2d0-9b02-4018-adc0-f9a6934c696a

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EXTERNAL_DEPLOY: "1"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 추가하세요."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx vinext deploy

      - name: Sync Jeju tournament data
        if: ${{ github.event_name == 'push' || inputs.sync_jeju }}
        run: node scripts/seed-jeju.mjs "$SITE_URL"

      - name: Summary
        if: always()
        run: echo "배포 대상 → $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
